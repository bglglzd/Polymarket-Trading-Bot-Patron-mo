# PolyPatronBot — AI-powered Polymarket trading platform
# Single live wallet with Claude AI forecast strategy

environment:
  enable_live_trading: true

wallets:
  - id: patron_live
    mode: LIVE
    strategy: ai_forecast
    capital: 99.36
    inception_date: "2026-03-14T22:50:00Z"  # ignore manual trades before bot started
    risk_limits:
      max_position_size: 25       # max $25 per position
      max_exposure_per_market: 20  # max $20 per market
      max_daily_loss: 15           # stop trading after $15 daily loss
      max_open_trades: 25          # max simultaneous positions (includes pre-existing manual trades)
      max_drawdown: 0.15           # 15% drawdown circuit breaker

strategy_config:
  ai_forecast:
    refresh_minutes: 15

polymarket:
  gamma_api: https://gamma-api.polymarket.com
  clob_api: https://clob.polymarket.com

# Whale Tracking Engine (disabled — not in use)
whale_tracking:
  enabled: false
